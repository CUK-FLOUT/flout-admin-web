name: "🎨 UI"
description: "Figma 디자인을 기반으로 FLOUT 운영자용 웹 화면 및 UI 컴포넌트를 구현합니다."
title: "[UI] "
labels:
  - "🎨 UI"

body:
  - type: textarea
    id: summary
    attributes:
      label: "🎨 구현 내용"
      placeholder: |
        - [ ] 화면 레이아웃 구현
        - [ ] 공통 컴포넌트 구현
        - [ ] 화면별 상태 UI 반영
        - [ ] PC 화면 크기별 레이아웃 확인
      value: |
        - [ ]
    validations:
      required: true

  - type: input
    id: figma
    attributes:
      label: "🔗 Figma"
      description: "구현할 화면의 Figma 링크를 첨부해주세요."
      placeholder: "Figma URL"
