name: "🔗 API 연동"
description: "프론트엔드와 백엔드 API 연동 작업"
title: "[API] "
labels: ["api"]
body:
  - type: textarea
    id: description
    attributes:
      label: "📌 작업 내용"
      description: "연동할 API와 작업 내용을 작성해주세요."
      placeholder: |
        예) 지원 관리 목록 조회 API 연동
    validations:
      required: true

  - type: textarea
    id: endpoints
    attributes:
      label: "🔗 API 엔드포인트"
      description: "연동할 API의 메서드와 경로를 작성해주세요."
      placeholder: |
        GET /api/...
        PATCH /api/...
    validations:
      required: false

  - type: textarea
    id: tasks
    attributes:
      label: "✅ 작업 목록"
      value: |
        - [ ] API 요청 및 응답 연동
        - [ ] 응답 데이터 타입 정의
        - [ ] 로딩 및 에러 처리
        - [ ] 기존 Mock 데이터 교체
        - [ ] API 동작 테스트
    validations:
      required: true

  - type: textarea
    id: references
    attributes:
      label: "📎 참고 자료"
      description: "Swagger, API 명세서, 관련 이슈 등을 첨부해주세요."
      placeholder: |
        Swagger:
        관련 이슈:
    validations:
      required: false
