name: Add FLOUT PR prefix

on:
  pull_request:
    types: [opened, edited, reopened]

permissions:
  contents: read
  issues: read
  pull-requests: write

jobs:
  add-prefix:
    runs-on: ubuntu-latest

    steps:
      - name: Add FLOUT number to PR title
        uses: actions/github-script@v8
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';

            const issueMatch =
              body.match(/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#(\d+)/i) ||
              body.match(/Issue:\s*(?:Closes\s*)?#(\d+)/i) ||
              body.match(/Issue:\s*#(\d+)/i);

            if (!issueMatch) {
              core.info('Linked issue number not found.');
              return;
            }

            const issueNumber = Number(issueMatch[1]);

            const { data: issue } = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber,
            });

            const floutMatch = issue.title.match(/^\[(FLOUT-\d+)\]/);

            if (!floutMatch) {
              core.info('FLOUT number not found in issue title.');
              return;
            }

            const prefix = `[${floutMatch[1]}]`;

            const cleanTitle = pr.title.replace(
              /^\[FLOUT-\d+\]\s*/,
              ''
            );

            await github.rest.pulls.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
              title: `${prefix} ${cleanTitle}`,
            });
